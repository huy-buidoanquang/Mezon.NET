name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Mezon.Net.sln

      - name: Build
        run: >
          dotnet build Mezon.Net.sln
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:BuildNumber=${{ github.run_number }}

      - name: Test
        run: >
          dotnet test Mezon.Net.sln
          -c Release
          --no-build
          --verbosity normal
